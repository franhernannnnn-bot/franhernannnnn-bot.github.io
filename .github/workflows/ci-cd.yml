name: CI/CD Zacahuil Huasteco
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Pruebas SEO y accesibilidad básicas
        run: node scripts/check-seo.js
      - name: Generar sitemap dinámico
        run: SITE_URL=https://${{ github.repository_owner }}.github.io node scripts/sitemap.js
      - name: Lighthouse (rendimiento, SEO, accesibilidad)
        run: npx --yes @lhci/cli@0.13 autorun --collect.staticDistDir=. --upload.target=temporary-public-storage || true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: SITE_URL=https://${{ github.repository_owner }}.github.io node scripts/sitemap.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4